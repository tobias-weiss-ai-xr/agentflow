# taskfleet-research competitive landscape ingestion sources.
#
# Each source resolves to either:
#   - a GitHub search query : {"type": "github", "query": "...", "sort": "stars"}
#   - an arXiv API query     : {"type": "arxiv", "categories": [...], "max": N}
#
# `category` is a coarse bucket for the digest rendering.
# `weight` boosts relevance scoring for higher-trust or more-relevant sources.
# `min_topics` drops items that match fewer than N keywords.

sources:
  # ---------- GitHub: direct competitors (parallel LLM + git worktree + gates) ----------
  - name: github-parallel-llm-dispatch
    type: github
    query: "parallel LLM task orchestration"
    sort: stars
    max: 20
    category: competitor
    weight: 3.0
    min_topics: 2

  - name: github-multi-agent-git-worktree
    type: github
    query: "multi-agent git worktree parallel dispatch"
    sort: stars
    max: 15
    category: competitor
    weight: 3.0
    min_topics: 1

  - name: github-multi-agent-shogun-like
    type: github
    query: "Claude Code parallel multi-agent orchestrate tmux"
    sort: stars
    max: 10
    category: competitor
    weight: 2.5
    min_topics: 1

  - name: github-llm-acceptance-gate
    type: github
    query: "LLM agent acceptance gate verify merge"
    sort: stars
    max: 10
    category: competitor
    weight: 2.5
    min_topics: 1

  - name: github-code-agent-orchestrator
    type: github
    query: "code agent orchestrator dispatch parallel task"
    sort: stars
    max: 15
    category: framework
    weight: 2.0
    min_topics: 2

  - name: github-codex-claude-parallel
    type: github
    query: "Codex Claude parallel branch agent"
    sort: stars
    max: 10
    category: framework
    weight: 2.0
    min_topics: 2

  - name: github-agent-harness-multi
    type: github
    query: "agent harness multi-model orchestrate"
    sort: stars
    max: 10
    category: framework
    weight: 1.8
    min_topics: 2

  # ---------- GitHub: adjacent frameworks (broader multi-agent) ----------
  - name: github-multi-agent-framework
    type: github
    query: "multi-agent LLM orchestration workflow DAG"
    sort: stars
    max: 15
    category: framework
    weight: 1.5
    min_topics: 2

  - name: github-agent-swarm-parallel
    type: github
    query: "agent swarm parallel LLM task"
    sort: stars
    max: 10
    category: framework
    weight: 1.5
    min_topics: 2

  - name: github-ai-dev-team
    type: github
    query: "autonomous AI dev team orchestrate"
    sort: stars
    max: 10
    category: framework
    weight: 1.5
    min_topics: 2

  # ---------- GitHub: tooling (observability, testing, CI for agents) ----------
  - name: github-agent-observability
    type: github
    query: "LLM agent observability tracing dashboard"
    sort: stars
    max: 10
    category: tooling
    weight: 1.2
    min_topics: 1

  - name: github-agent-testing
    type: github
    query: "LLM agent testing evaluation benchmark"
    sort: stars
    max: 10
    category: tooling
    weight: 1.2
    min_topics: 1

  # ---------- arXiv: research papers ----------
  - name: arxiv-multi-agent-orchestration
    type: arxiv
    categories: ["cs.AI", "cs.SE", "cs.DC"]
    max: 40
    category: paper
    weight: 2.0
    query_filter: '("multi-agent" OR "multi agent" OR "orchestrat*") AND ("LLM" OR "language model" OR "code generation")'

  - name: arxiv-parallel-code-generation
    type: arxiv
    categories: ["cs.SE", "cs.PL", "cs.AI"]
    max: 30
    category: paper
    weight: 1.8
    query_filter: '("parallel" OR "concurrent") AND ("code generation" OR "program synthesis" OR "automated programming")'

  - name: arxiv-agent-verification
    type: arxiv
    categories: ["cs.SE", "cs.AI", "cs.LO"]
    max: 30
    category: paper
    weight: 1.8
    query_filter: '("LLM" OR "language model" OR "code") AND ("verification" OR "acceptance test" OR "formal method" OR "self-check")'

  - name: arxiv-task-decomposition
    type: arxiv
    categories: ["cs.AI", "cs.CL"]
    max: 30
    category: paper
    weight: 1.5
    query_filter: '("task decomposition" OR "plan generation" OR "goal decomposition") AND ("agent" OR "LLM" OR "language model")'

# ----------------- Keyword classification -----------------
